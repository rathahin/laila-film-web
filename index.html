    const p=offset6(currentLayout6()),isPanel=target6.value==='panel';ui6('layFields6').innerHTML=['x','y',...(isPanel?['z','rx']:[]),'ry','s'].map(k=>`<label>${({x:'Horizontal',y:'Vertical',z:'Depth',rx:'Tilt',ry:isPanel?'Rotation':['badge','heading'].includes(target6.value)?'Rotation':'Content rotation',s:'Size'})[k]}<input data-k="${k}" type="number" step="${k==='s'?.05:1}" value="${p[k]}" ${k==='s'?'min="0.2" max="3"':''}></label>`).join('');};
  const pauseFilm6=()=>{if(!paused6){frozenNow6=performance.now();paused6=true;}};
  const resumeFilm6=()=>{if(paused6){if(playStart!==null)playStart+=performance.now()-frozenNow6;paused6=false;}};
  const layoutSeek6=()=>{const t=[265,274,283,290][Number(view6.value)];act=5;idle=false;chainEnd=-1;marksUntil=0;pending=-1;doneSent=true;frozenNow6=performance.now();playStart=frozenNow6-(t-ACTS[5][0])*1000;paused6=true;if(view6.value!=='3')panel6.value=view6.value;updateFields6();};
  const setLayoutMode6=on=>{layoutMode6=on;layoutTools6.style.display=on?'block':'none';layoutDrag6.style.display=on?'block':'none';layoutToggle6.textContent=on?'Exit layout · L':paused6?'Paused · Space to resume':'Layout · L';if(on){pauseFilm6();layoutSeek6();}else{status6('Paused. Press Space to resume.');}};
  layoutToggle6.onclick=()=>setLayoutMode6(!layoutMode6);ui6('layDone6').onclick=()=>setLayoutMode6(false);
  view6.onchange=layoutSeek6;panel6.onchange=updateFields6;target6.onchange=()=>{panel6.disabled=['badge','heading'].includes(target6.value);if(target6.value==='badge'){view6.value='3';layoutSeek6();}else if(target6.value==='heading'){if(view6.value==='3')view6.value='0';layoutSeek6();}else updateFields6();};
  ui6('layFields6').oninput=e=>{const k=e.target.dataset.k;if(!k)return;
    if(target6.value==='glass'){if(k==='tint'){const v=e.target.value.trim();if(!/^#[0-9a-f]{6}$/i.test(v))return;currentLayout6().tint=v.toLowerCase();}else if(k==='glassBlur'){const v=Number(e.target.value);if(!Number.isFinite(v))return;layout6.glassBlur=Math.max(0,Math.min(60,v));}else{const v=Number(e.target.value);if(!Number.isFinite(v))return;const def=GLASS_KEYS6.find(d=>d[0]===k);currentLayout6()[k]=Math.max(def[2],Math.min(def[3],v));}applyGlass6();layoutRevision6++;status6('Unsaved changes');return;}
    const v=Number(e.target.value);if(!Number.isFinite(v))return;currentLayout6()[k]=k==='s'?Math.max(.2,Math.min(3,v)):v;layoutRevision6++;status6('Unsaved changes');};
  ui6('layFields6').onclick=e=>{const sw=e.target&&e.target.dataset&&e.target.dataset.sw;if(!sw||target6.value!=='glass')return;currentLayout6().tint=sw;const f=ui6('layFields6').querySelector('input[data-k=tint]');if(f)f.value=sw;applyGlass6();layoutRevision6++;status6('Unsaved changes');};
  ui6('laySave6').onclick=async()=>{
    const button=ui6('laySave6'),snapshot=JSON.stringify(layout6);button.disabled=true;status6('Saving layout to your Mac…');
    try{
      const response=await fetch(layoutURL6,{method:'POST',headers:{'Content-Type':'application/json','X-Laila-Layout':'1'},body:snapshot,signal:AbortSignal.timeout(5000)});
      if(!response.ok)throw Error('Save failed: '+response.status);
      const saved=await response.json();
      const check=await fetch(layoutURL6,{cache:'no-store',signal:AbortSignal.timeout(4000)});
      if(!check.ok||JSON.stringify(await check.json())!==JSON.stringify(saved))throw Error('Could not verify saved layout');
      try{localStorage.setItem(layoutKey6,JSON.stringify(saved));}catch(e){}
      status6(JSON.stringify(layout6)===snapshot?'Saved to your Mac. Ready for the next Preview.':'Saved. Newer changes still need saving.');
    }catch(e){status6('Not saved. Keep the film server running, then click Save again.');}
    finally{button.disabled=false;}
  };
  ui6('layReset6').onclick=()=>{const p=currentLayout6();for(const k of Object.keys(p))delete p[k];if(target6.value==='glass'){delete layout6.glassBlur;applyGlass6();}layoutRevision6++;updateFields6();status6('Target reset. Save to keep this change.');};
  ui6('layExport6').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(layout6,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='LAILA-Act6-layout.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
  ui6('layImport6').onclick=()=>ui6('layFile6').click();
  ui6('layFile6').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());for(const k of ['solo','stack','content'])if(!Array.isArray(d[k])||d[k].length!==3)throw Error('shape');for(const k of ['solo','stack'])d[k]=d[k].map(offset6);d.content=d.content.map(p=>({left:offset6(p.left||{}),right:offset6(p.right||{})}));d.badge=offset6(d.badge||{});d.heading=offset6(d.heading||{});if(!Array.isArray(d.glass)||d.glass.length!==3)d.glass=[{},{},{}];layout6=d;applyGlass6();layoutRevision6++;updateFields6();status6('Imported. Save to keep this layout.');}catch(e){status6('Invalid layout file. Choose an exported layout JSON.');}};
  let dragLayout6=null;
  layoutDrag6.onpointerdown=e=>{if(target6.value==='glass')return;const p=offset6(currentLayout6());dragLayout6={x:e.clientX,y:e.clientY,px:p.x,py:p.y};layoutDrag6.setPointerCapture(e.pointerId);};
  layoutDrag6.onpointermove=e=>{if(!dragLayout6)return;const p=currentLayout6(),stack=view6.value==='3',unit=U*(stack&&!['badge','heading'].includes(target6.value)?.7:1),isPanel=target6.value==='panel';p.x=Math.round(dragLayout6.px+(e.clientX-dragLayout6.x)/unit);p.y=Math.round(dragLayout6.py+(e.clientY-dragLayout6.y)/unit*(isPanel?-1:1));layoutRevision6++;updateFields6();status6('Unsaved changes');};
  layoutDrag6.onpointerup=layoutDrag6.onpointercancel=()=>dragLayout6=null;
  addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();e.stopImmediatePropagation();if(layoutMode6)setLayoutMode6(false);if(paused6)resumeFilm6();else pauseFilm6();layoutToggle6.textContent=paused6?'Paused · Space to resume':'Layout · L';}else if(e.key.toLowerCase()==='l'){e.preventDefault();e.stopImmediatePropagation();setLayoutMode6(!layoutMode6);}},true);

  addEventListener('keydown', (e) => {
    if(layoutMode6 || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
    const n = parseInt(e.key, 10);
    if (e.key === 's' || e.key === 'S') { sndToggle(); return; }
    if (n >= 1 && n <= 6) startAct(n - 1);
    else if (e.key === 'a' || e.key === 'A') command(10 + BUILT);                                                  // play every act in one go
    else if (e.key === 'r' || e.key === 'R') startAct(act);
    else if (e.key === 'Escape') idle = true;
  });
  // clicks on the page background pass through to the 3D scene, so starting an act uses real buttons (shown only while idle)
  const TITLES = ['Problem', 'Solution', 'Components', 'Action play', 'Results', 'Roadmap'];
  { const all = document.createElement('button'); all.textContent = '▶ Play all · Acts 1–' + BUILT; all.style.fontWeight = '700'; all.addEventListener('click', () => command(10 + BUILT)); menu.appendChild(all); }       // one button for the whole film (the green corner marks flash for 1.7 s first, then the film starts)
  for (let i = 0; i < BUILT; i++) { const b = document.createElement('button'); b.textContent = '▶ Play Act ' + (i + 1) + ' · ' + TITLES[i]; b.addEventListener('click', () => startAct(i)); menu.appendChild(b); }
  menu.appendChild(sndBtn);
  const msg = document.createElement('span'); msg.className = 'note'; msg.textContent = 'Start your screen recording first, then click Play all (or press A). S turns the sound on and off. Click the top-left corner to come back to this menu.'; menu.appendChild(msg);
  resetBtn.addEventListener('click', () => { idle = true; });
  // Remote control for record_film.py. The film server holds one numbered command; this page asks for it, acknowledges it and reports when it is done.
  // Command code: 10 * first act + last act (for example 14 = play Acts 1 to 4); 97 = show the corner marks only; 98 = ping; 99 = back to the menu.
  const BASE = ICON_URL.replace(/icons\/$/, '');
  const ping = (p) => { const im = new Image(); im.src = BASE + 'signal/' + p + (p.indexOf('?') < 0 ? '?' : '&') + 'r=' + Date.now(); };
  const marks = [0, 1, 2, 3].map(() => { const d = document.createElement('div'); d.style.cssText = 'position:fixed;left:0;top:0;width:14px;height:14px;background:#00ff00;display:none;z-index:99;pointer-events:none;'; document.body.appendChild(d); return d; });
  let lastSeq = 0;
  const command = (code) => {
    if (code === 99) { idle = true; marksUntil = 0; pending = -1; return; }
    if (code === 98) return;
    if (code === 97) { marksUntil = performance.now() + 3000; pending = -1; return; }
    const a = Math.floor(code / 10) - 1, b = (code % 10) - 1;
    if (a < 0 || a >= BUILT || b < a) return;
    act = a; idle = true; chainEnd = Math.min(b, BUILT - 1); pending = a; marksUntil = performance.now() + 1700;
  };
  if (hold === null) setInterval(() => {
    const im = new Image();
    im.onload = () => { const seq = im.naturalHeight; if (seq > lastSeq) { lastSeq = seq; ping('ack?seq=' + seq); command(im.naturalWidth); } };
    im.src = BASE + 'signal/cmd.png?r=' + Date.now();
  }, 250);

  function frame(now) {
    if(paused6)now=frozenNow6;
    if (marksUntil) {                                                        // the recorder's pre-roll: four green marks at the corners of the 16:9 picture
      const sh = Math.min(VH, VW * 9 / 16), sw = sh * 16 / 9, x0 = (VW - sw) / 2, y0 = (VH - sh) / 2;
      if (now < marksUntil) marks.forEach((m, i) => { m.style.display = 'block'; m.style.left = (i % 2 ? x0 + sw - 14 : x0) + 'px'; m.style.top = (i > 1 ? y0 + sh - 14 : y0) + 'px'; });
      else { marks.forEach((m) => { m.style.display = 'none'; }); marksUntil = 0; if (pending >= 0) { const e = chainEnd; startAct(pending, e); pending = -1; doneSent = false; } }
    }
    if (!idle && hold === null) while (chainEnd > act && (now - playStart) / 1000 >= ACTS[act][1] - ACTS[act][0]) { playStart += (ACTS[act][1] - ACTS[act][0]) * 1000; act++; }
    let t;
    if (hold !== null) t = hold;
    else if (idle) t = ACTS[act][0];
    else t = Math.min(ACTS[act][0] + (now - playStart) / 1000, ACTS[act][1]);
    filmTime6=t;
    layoutToggle6.style.display=(idle||paused6||layoutMode6)?"block":"none";
    W3.idle = idle && hold === null;                                           // on the menu the video man stays hidden
    cover.style.opacity = (W3.idle ? 1 : Math.max(prog(t, 50.0, 0.4) * (1 - prog(t, 137.0, 0.4)), prog(t, 193.0, 0.4) * (1 - (has6 ? prog(t, 251.6, 0.8) : 0)))).toFixed(3);   // Act 6 uncovers the 3D again when the real glass panels are in the scene   // an opaque backdrop over the 3D layer wherever the film does not need 3D (menu, Acts 2-3, Acts 5-6), so nothing from Act 1 can ever show through
    menu.style.display = idle && hold === null && !marksUntil ? 'flex' : 'none';
    sndSync(t, !paused6 && !idle && hold === null && t < ACTS[Math.max(act, chainEnd)][1] - 0.05);
    if (!idle && !doneSent && act >= chainEnd && (now - playStart) / 1000 >= ACTS[act][1] - ACTS[act][0] + 1.2) { doneSent = true; ping('done'); }
    // camera: the same move drives the CSS world and the Spline camera
    if (LG.ok && LG.u !== U) { LG.u = U; LG.filters.forEach((f) => f.setAttribute('scale', (16 * U).toFixed(2))); }
    const zoom = zoomAt(t);
    cam.dz = CAMZ * (1 - 1 / zoom);
    cam.cy = lin(t, [[0, 0], [18.5, 16], [27.5, 10], [41, 30], [44.2, 0], [50, 0], [83, 10], [137, 0], [193, 6]]) + (t < 9 ? -40 * Math.exp(-t / 1.5) : 0);
    cam.cx = Math.sin(t * 0.21) * (7 + 8 * prog(t, 83, 12)) + (t < 9 ? 150 * Math.exp(-t / 1.7) : 0);      // the opening swoop: the camera sweeps in from the side and settles
    world.style.transform = 'translate3d(' + (-cam.cx * U).toFixed(2) + 'px,' + (cam.cy * U).toFixed(2) + 'px,' + (cam.dz * U).toFixed(2) + 'px)';
    if (camObj) send(camObj.id, { position: { x: r2(cam.cx), y: r2(cam.cy), z: r2((CAMZ - cam.dz) * CAMK) } });
    // the rotating fan behind everything follows film time, so clips join seamlessly
    custImg(t >= 20.3 && t < 83);
    if (t < 53) act1(t);
    else {                                                                      // outside Act 1 the man is gone, whichever way he was drawn: the video plane AND the photo fallback
      if (W3.on) { if (Math.floor(now / 2000) !== manTick) { manTick = Math.floor(now / 2000); last[W3.man.open.id] = ''; last[W3.man.sad.id] = ''; } manPlane('open', 0, 0, 1, 0); manPlane('sad', 0, 0.5, 1, 0); }
      put(PH.A, 0, 0, 0, 0); put(PH.B, 0, 0, 0, 0); put(PH.C, 0, 0, 0, 0);
      if (VID.el) put(VID.el, 0, 0, 0, 0); if (VID2.el) put(VID2.el, 0, 0, 0, 0);   // the HTML video frames too: they are the picture that was showing through
    }
    if (W3.idle) { put(PH.A, 0, 0, 0, 0); put(PH.B, 0, 0, 0, 0); put(PH.C, 0, 0, 0, 0); if (VID.el) put(VID.el, 0, 0, 0, 0); if (VID2.el) put(VID2.el, 0, 0, 0, 0); hide6(); }   // and never on the menu either
    put(logo1, 560, 322, 9, t < 53 ? eout(prog(t, 12.0, 0.8)) * (1 - prog(t, 19.2, 0.6)) : 0);   // the Asiacell logo, top right, while the six services circle in front of him
    act2(t);
    const t3 = t >= 83 ? t + 9 : t;                                         // the customer introduction (83 to 92 s) was cut: the acts after it keep their own numbers but run 9 s earlier
    act3(t3);
    act4(t3);
    act5(t3);
    act6(t >= 251.6 ? t + 11.4 : t3);                                       // Act 6 follows the Act 5 line 2.4 s sooner
    fade.style.opacity = Math.max(1 - eio(prog(t, 0.0, 2.4)), eio(prog(t, 9999, 1.4))).toFixed(3);                                           // no fade to black: the vote frame is the last picture
    // the background turns from cool silver to warm white between 1:03 and 1:18
    const warm = eio(prog(t, 63.2, 15));
    const va = 1;          // how much the fan is veiled: it only dims the fan, never the phone in front of it
    const vr = Math.round(lerp(244, 248, warm)), vg = Math.round(lerp(246, 246, warm)), vb = Math.round(lerp(250, 242, warm));
    if (veil) send(veil.id, { visible: va > 0.004, material: { color: '#' + [vr, vg, vb].map((v) => v.toString(16).padStart(2, '0')).join(''), alpha: Math.round(va * 100) } });
    else if (!/[?&]bg=/.test(location.search || '')) { wash.style.backgroundColor = 'rgba(' + vr + ',' + vg + ',' + vb + ',.9)'; wash.style.opacity = (va / 0.9).toFixed(3); }
    glow.style.opacity = (warm * (1 - prog(t, 143, 3))).toFixed(3);
    drawDust(t, 0);                                                         // the drifting dust is off in every act (the client asked for a clean background)
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
